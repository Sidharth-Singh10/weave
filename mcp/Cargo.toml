[package]
name = "weave-mcp"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Local embeddings via fastembed (ONNX). Enabling this adds a large dependency
# and downloads an embedding model on first use. Without it, a deterministic
# stub embedder keeps the retrieval pipeline working (no semantic similarity).
embedding = ["dep:fastembed"]

[dependencies]
rmcp = { version = "3", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
url = "2"
sha2 = "0.11.0"
hex = "0.4"
pgvector = { version = "0.4", features = ["sqlx"] }
fastembed = { version = "5", features = ["hf-hub"], optional = true }
weave-core = { path = "../crates/weave-core" }

[dev-dependencies]
rmcp = { version = "3", features = ["client", "transport-child-process", "schemars"] }

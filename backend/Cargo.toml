[package]
name = "weave-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.13.1"
anyhow = "1.0.104"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
dotenvy = "0.15.7"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
thiserror = "2.0.20"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[package]
name = "weave-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
thiserror = "2.0.20"
oauth2 = { version = "5.0.0", features = ["reqwest"] }
openidconnect = { version = "4.0.1", features = ["reqwest"] }
sha2 = "0.11.0"
hex = "0.4.3"
axum-extra = { version = "0.12.6", features = ["cookie"] }
time = "0.3"
weave-core = { path = "../crates/weave-core" }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
